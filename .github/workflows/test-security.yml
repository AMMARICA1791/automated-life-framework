name: Security Test - Private Exclusion (Safe - No Drive Access)
on:
  workflow_dispatch:

jobs:
  security-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Negative and positive tests of actual sync.py audit
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from tempfile import TemporaryDirectory

          source = Path("docs/sync.py").read_text()
          tree = ast.parse(source)
          wanted = {"is_private_path", "is_private_folder_name", "audit_directory"}
          nodes = [node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name in wanted]
          assert {n.name for n in nodes} == wanted, "Missing actual audit functions"
          scope = {"Path": Path, "EXCLUDED_KEYWORDS": ("private", "خاص", "سري", "personal"), "DESTINATION": Path("hayat")}
          exec(compile(ast.Module(body=nodes, type_ignores=[]), "docs/sync.py", "exec"), scope)
          with TemporaryDirectory() as tmp:
              root = Path(tmp) / "hayat"
              (root / "docs").mkdir(parents=True)
              (root / "docs" / "README.md").write_text("# Public")
              (root / "journal" / "private").mkdir(parents=True)
              (root / "journal" / "private" / "test-private.md").write_text("fake secret")
              (root / "my-personal-notes.md").write_text("fake personal")
              print("=== SECURITY AUDIT ===")
              print("Negative test files:", sorted(str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()))
              try:
                  scope["audit_directory"](root)
              except RuntimeError:
                  print("NEGATIVE: PASS (real audit raised RuntimeError; CLI would exit nonzero)")
              else:
                  raise SystemExit("NEGATIVE: FAIL (audit allowed private file)")
              (root / "journal" / "private" / "test-private.md").unlink()
              (root / "journal" / "private").rmdir()
              (root / "my-personal-notes.md").unlink()
              scope["audit_directory"](root)
              print("POSITIVE: PASS")
              print("Clean files:", sorted(str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()))
              for keyword in ("private", "خاص", "سري", "personal"):
                  assert scope["is_private_path"]("journal/" + keyword + "/test.md")
              print("KEYWORD EXCLUSION: PASS")
          PY
      - name: Independent rsync exclusion test (not used in production publish path)
        run: |
          mkdir -p sample/journal/private sample/docs output
          echo public > sample/docs/README.md
          echo fake > sample/journal/private/secret.md
          echo fake > sample/my-personal-notes.md
          rsync -a --exclude='*private*' --exclude='*personal*' --exclude='journal/private/' sample/ output/
          echo "rsync output:"
          find output -type f | sort
          test -f output/docs/README.md
          test ! -e output/journal/private/secret.md
          test ! -e output/my-personal-notes.md
          echo "RSYNC EXCLUSION: PASS (independent test only)"
